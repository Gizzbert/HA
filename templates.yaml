# templates.yaml
# templating: https://www.home-assistant.io/docs/configuration/templating/
#
# Energy totals, EVCC/Marstek power and the DSMR/battery dashboard sensors are
# in packages/energy_calculations.yaml. PV copies, NextEnergy prices and the
# motion history stay here.
#
# `to: null` on a state trigger runs when the state string changes (including
# unavailable) and does not run for attribute-only updates.

# Attribute of sensor.inverter_gw4200d_ns (spelling is the integration's).
# A state trigger would miss temperature updates that do not change the
# inverter entity's state string, so this sensor stays state-based.
- sensor:
    - name: "PV Temperature"
      state: "{{ state_attr('sensor.inverter_gw4200d_ns', 'tempperature') }}"
      availability: "{{ is_number(state_attr('sensor.inverter_gw4200d_ns', 'tempperature')) }}"
      unit_of_measurement: "°C"

- triggers:
    - trigger: state
      entity_id: sensor.goodwe_today_s_pv_generation
      to: null
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Today's PV generation East"
      availability: "{{ is_number(states('sensor.goodwe_today_s_pv_generation')) }}"
      state: "{{ states('sensor.goodwe_today_s_pv_generation') }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

- triggers:
    - trigger: state
      entity_id: sensor.goodwe_total_pv_generation
      to: null
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Total PV generation East"
      availability: "{{ is_number(states('sensor.goodwe_total_pv_generation')) }}"
      state: "{{ states('sensor.goodwe_total_pv_generation') }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

- triggers:
    - trigger: state
      entity_id: sensor.sunnyboy_today_s_energy_supply
      to: null
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Today's PV generation West"
      availability: "{{ is_number(states('sensor.sunnyboy_today_s_energy_supply')) }}"
      state: "{{ states('sensor.sunnyboy_today_s_energy_supply') }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

# --- Prijzen ---
# Passthrough. Unavailable when the source is not numeric, so a missing price
# is not published as 0 EUR/kWh (0 is a real price).
- triggers:
    - trigger: state
      entity_id: sensor.current_electricity_price_all_in
      to: null
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Electricity Price EUR kWh"
      unique_id: electricity_price_eur_kwh_marstek_control
      unit_of_measurement: "EUR/kWh"
      state_class: measurement
      availability: "{{ is_number(states('sensor.current_electricity_price_all_in')) }}"
      state: "{{ states('sensor.current_electricity_price_all_in') | float(0) }}"

- triggers:
    - trigger: state
      entity_id: sensor.nord_pool_nl_huidige_prijs
      to: null
    - trigger: homeassistant
      event: start
  sensor:
    - name: "NextEnergy electricity all-in"
      unique_id: nextenergy_electricity_all_in
      unit_of_measurement: "EUR/kWh"
      state_class: measurement
      availability: "{{ is_number(states('sensor.nord_pool_nl_huidige_prijs')) }}"
      state: >
        {% set market = states('sensor.nord_pool_nl_huidige_prijs') | float(0) %}
        {% set purchase_fee_incl_vat = 0.02190 %}
        {% set energy_tax_incl_vat = 0.11084 %}
        {{ (market * 1.21 + purchase_fee_incl_vat + energy_tax_incl_vat) | round(5) }}

# The Enever `data` list is the source. Indexing it with now().hour at
# second 0 of the hour writes the string "unknown" whenever the list is
# missing or not yet aligned to the new hour, and a monetary sensor rejects
# that. Resolve the row whose `datum` falls in the current hour (hour-index
# fallback), render nothing when that is not a number, and re-evaluate a
# few seconds after the hour so a refresh that lands at :00:10 is visible.
# No `to: null`: the price list lives on the attribute and must still be heard.
- triggers:
    - trigger: state
      entity_id:
        - sensor.enever_electricity_prices_today_2
        - sensor.enever_electricity_prices_tomorrow_2
    - trigger: time_pattern
      minutes: 0
      seconds: 30
    - trigger: homeassistant
      event: start
  sensor:
    - name: "NextEnergy current price"
      unique_id: nextenergy_current_price
      unit_of_measurement: "EUR/kWh"
      device_class: monetary
      availability: >
        {% set rows = state_attr('sensor.enever_electricity_prices_today_2', 'data') or [] %}
        {% set start = as_timestamp(now().replace(minute=0, second=0, microsecond=0)) %}
        {% set ns = namespace(value=none) %}
        {% for r in rows %}
          {% if r is mapping and r.prijsNE is defined and r.datum is defined %}
            {% set stamp = as_timestamp(r.datum, none) %}
            {% if stamp is not none and start <= stamp < start + 3600 %}
              {% set ns.value = r.prijsNE | float(none) %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.value is none and rows | length > now().hour and rows[now().hour] is mapping and rows[now().hour].prijsNE is defined %}
          {% set ns.value = rows[now().hour].prijsNE | float(none) %}
        {% endif %}
        {{ is_number(ns.value) }}
      state: >
        {% set rows = state_attr('sensor.enever_electricity_prices_today_2', 'data') or [] %}
        {% set start = as_timestamp(now().replace(minute=0, second=0, microsecond=0)) %}
        {% set ns = namespace(value=none) %}
        {% for r in rows %}
          {% if r is mapping and r.prijsNE is defined and r.datum is defined %}
            {% set stamp = as_timestamp(r.datum, none) %}
            {% if stamp is not none and start <= stamp < start + 3600 %}
              {% set ns.value = r.prijsNE | float(none) %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.value is none and rows | length > now().hour and rows[now().hour] is mapping and rows[now().hour].prijsNE is defined %}
          {% set ns.value = rows[now().hour].prijsNE | float(none) %}
        {% endif %}
        {{ ns.value }}
      attributes:
        prices: >
          {% set today = state_attr('sensor.enever_electricity_prices_today_2', 'data') or [] %}
          {% set tomorrow = state_attr('sensor.enever_electricity_prices_tomorrow_2', 'data') or [] %}
          {% set ns = namespace(items=[]) %}
          {% for r in (today + tomorrow) %}
            {% if r is mapping and r.prijsNE is defined %}
              {% set ns.items = ns.items + [{'from': r.datum | default(none), 'price': r.prijsNE | float(0)}] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}

# Current 15-minute export slot. The price list is an attribute of
# sensor.nextenergy_prices_today, so the state trigger must hear attributes.
# Quarter-hour clock replaces the per-minute now() listener. NL day-ahead
# slots are 15 minutes; an hourly slot just renders the same price three extra times.
- triggers:
    - trigger: state
      entity_id: sensor.nextenergy_prices_today
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
  sensor:
    - name: "NextEnergy electricity export tariff"
      unique_id: nextenergy_electricity_export_tariff
      unit_of_measurement: "EUR/kWh"
      state_class: measurement
      icon: mdi:transmission-tower-export
      availability: >
        {% set prices = state_attr('sensor.nextenergy_prices_today', 'prices') or [] %}
        {% set current = as_timestamp(now()) %}
        {% set ns = namespace(found=false) %}
        {% for item in prices %}
          {% if as_timestamp(item.start) <= current < as_timestamp(item.end) %}
            {% set ns.found = true %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      state: >
        {# VAT convention, unchanged: sensor.nextenergy_prices_today stores
           (EPEX EUR/MWh / 1000) * 1.21 + purchase fee incl. VAT + energy tax incl. VAT.
           VAT (21%) is applied only to the EPEX price. The two constants below are
           already incl. VAT and are subtracted back out, leaving EPEX * 1.21.
           Contract 240023: verkoopvergoeding is €0.00/kWh from 2026-11-13 (was €0.01).
           Zonnebonus art. 10 is 50% of that same EPEX * 1.21 basis, local 06:00–22:00,
           only when the basis is positive, and only from the new contract.
           The 6,000 kWh/year cap is not modelled. Battery export does not earn the bonus. #}
        {% set purchase_fee_incl_vat = 0.02190 %}
        {% set energy_tax_incl_vat = 0.11084 %}
        {% set export_fee_before = 0.01000 %}
        {% set export_fee_from = 0.00000 %}
        {% set contract_start = '2026-11-13' %}
        {% set zonnebonus_rate = 0.50 %}
        {% set bonus_from_hour = 6 %}
        {% set bonus_until_hour = 22 %}
        {% set prices = state_attr('sensor.nextenergy_prices_today', 'prices') or [] %}
        {% set current = as_timestamp(now()) %}
        {% set ns = namespace(value=none) %}
        {% for item in prices %}
          {% if as_timestamp(item.start) <= current < as_timestamp(item.end) %}
            {% set slot = as_local(as_datetime(item.start)) %}
            {% set on_contract = slot.strftime('%Y-%m-%d') >= contract_start %}
            {% set export_fee = export_fee_from if on_contract else export_fee_before %}
            {% set epex_incl_vat = (item.price | float) - purchase_fee_incl_vat - energy_tax_incl_vat %}
            {% set in_bonus_window = bonus_from_hour <= slot.hour < bonus_until_hour %}
            {% set bonus = zonnebonus_rate * epex_incl_vat if on_contract and in_bonus_window and epex_incl_vat > 0 else 0 %}
            {% set ns.value = (epex_incl_vat - export_fee + bonus) | round(5) %}
          {% endif %}
        {% endfor %}
        {{ ns.value }}
      attributes:
        prices: >
          {% set purchase_fee_incl_vat = 0.02190 %}
          {% set energy_tax_incl_vat = 0.11084 %}
          {% set export_fee_before = 0.01000 %}
          {% set export_fee_from = 0.00000 %}
          {% set contract_start = '2026-11-13' %}
          {% set zonnebonus_rate = 0.50 %}
          {% set bonus_from_hour = 6 %}
          {% set bonus_until_hour = 22 %}
          {% set prices = state_attr('sensor.nextenergy_prices_today', 'prices') or [] %}
          {% set ns = namespace(items=[]) %}
          {% for item in prices %}
            {% set slot = as_local(as_datetime(item.start)) %}
            {% set on_contract = slot.strftime('%Y-%m-%d') >= contract_start %}
            {% set export_fee = export_fee_from if on_contract else export_fee_before %}
            {% set epex_incl_vat = (item.price | float) - purchase_fee_incl_vat - energy_tax_incl_vat %}
            {% set in_bonus_window = bonus_from_hour <= slot.hour < bonus_until_hour %}
            {% set bonus = zonnebonus_rate * epex_incl_vat if on_contract and in_bonus_window and epex_incl_vat > 0 else 0 %}
            {% set ns.items = ns.items + [{
              'start': item.start,
              'end': item.end,
              'price': (epex_incl_vat - export_fee + bonus) | round(5)
            }] %}
          {% endfor %}
          {{ ns.items }}

# --- Nord Pool prices today + tomorrow, NextEnergy all-in ---
- triggers:
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/15"
  actions:
    - action: nordpool.get_prices_for_date
      data:
        config_entry: "01M4Y5BCXBJCG6J060J50J3911"
        date: "{{ now().date() }}"
        areas:
          - NL
        currency: EUR
      response_variable: today_prices
    - action: nordpool.get_prices_for_date
      continue_on_error: true
      data:
        config_entry: "01M4Y5BCXBJCG6J060J50J3911"
        date: "{{ (now() + timedelta(days=1)).date() }}"
        areas:
          - NL
        currency: EUR
      response_variable: tomorrow_prices
  sensor:
    - name: "NextEnergy prices today"
      unique_id: nextenergy_prices_today
      state: "{{ now().isoformat() }}"
      attributes:
        prices: >
          {% set fee_incl_vat = 0.02190 %}
          {% set tax_incl_vat = 0.11084 %}
          {% set t = today_prices.get('NL', []) if today_prices is defined and today_prices else [] %}
          {% set m = tomorrow_prices.get('NL', []) if tomorrow_prices is defined and tomorrow_prices else [] %}
          {% set ns = namespace(items=[]) %}
          {% for item in t + m %}
            {% set ns.items = ns.items + [{
              'start': item.start,
              'end': item.end,
              'price': ((item.price | float) / 1000 * 1.21 + fee_incl_vat + tax_incl_vat) | round(5)
            }] %}
          {% endfor %}
          {{ ns.items }}

# --- Motion change-history ---
- triggers:
    - trigger: state
      entity_id:
        - binary_sensor.beweging_tuinkamer
      not_to:
        - unavailable
        - unknown
      not_from:
        - unavailable
        - unknown
  sensor:
    - unique_id: dbf841e2-ae6f-4fc1-9534-a1046204945f
      name: Nominal Change History
      state: "OK"
      attributes:
        changes: >
          {% set current = this.attributes.get('changes', {}) %}
          {% set new = {trigger.entity_id: trigger.to_state.last_changed.isoformat()} %}
          {{ dict(current, **new) }}

# Calendar date only. Midnight plus start replaces a now() listener that ran every minute.
- triggers:
    - trigger: time
      at: "00:00:00"
    - trigger: homeassistant
      event: start
  binary_sensor:
    - name: "Xmas lights season"
      unique_id: xmas_lights_season
      icon: mdi:string-lights
      state: >
        {% set m = now().month %}
        {% set d = now().day %}
        {{ (m == 12) or (m == 1 and d <= 31) }}

# Restored across restart; the 2 minute delays re-arm only when the power state changes.
- triggers:
    - trigger: state
      entity_id: sensor.net_power_filtered_for_control
      to: null
  binary_sensor:
    - name: "PV Surplus"
      unique_id: pv_surplus_marstek_control
      state: "{{ states('sensor.net_power_filtered_for_control') | float(0) < -150 }}"
      delay_on:
        minutes: 2
      delay_off:
        minutes: 2

- triggers:
    - trigger: state
      entity_id: sensor.electricity_price_eur_kwh
      to: null
  binary_sensor:
    - name: "Negative Electricity Price"
      unique_id: negative_electricity_price_marstek_control
      state: "{{ states('sensor.electricity_price_eur_kwh') | float(0) < 0 }}"
