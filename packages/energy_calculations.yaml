# packages/energy_calculations.yaml
#
# Grid, solar-power and battery calculations for the Energy dashboard.
# Loaded via configuration.yaml:
#   homeassistant.packages: !include_dir_named packages
#
# PV energy copies and NextEnergy / Frank Energie prices stay in templates.yaml.
# Derivative helpers and the Riemann sums of charge power stay in
# configuration.yaml (the derivative sensors have no unique_id).
#
# Triggers use `to: null`: fire when the source state string changes, including
# to unavailable, and skip attribute-only updates. A bare state trigger would
# also run on attribute changes and would not reduce load.
# `homeassistant` start re-reads external sources after reboot so a restored
# number is not kept after the source is unknown.
#
# These look similar but are not the same quantity. Entity ids are unchanged:
# - sensor.grid_power_net (Dutch DSMR kW, times 1000)
#   vs sensor.net_energy_consumption (English DSMR W)
# - sensor.grid_import_energy_total / sensor.grid_export_energy_total
#   vs the filtered English tarif sums (those reject a drop or a >1 kWh step)
# - sensor.marstek_combined_total_grid_export_clean is EVCC discharge
#   (`energy`, Modbus 33002). sensor.marstek_combined_total_grid_import_clean
#   is EVCC charge (`returnEnergy`, Modbus 33000). Both reject one decrease
#   or a step above 0.25 kWh, then re-baseline with an offset after 30 min
#   so the published total does not jump.
# - sensor.marstek_combined_grid_power (EVCC MQTT, sign -1)
#   vs sensor.marstek_total_ac_power (Venus Modbus)
# - sensor.eigen_verbruik (solar + net) vs sensor.own_usage_power (solar + grid import + battery)

utility_meter:
  marstek_venus_beta_modbus_dagelijkse_ontlaadenergie:
    source: sensor.marstek_venus_beta_modbus_totale_ontlaadenergie
    cycle: daily
    name: "Marstek Venus Beta Ontladen Vandaag"
  marstek_venus_beta_modbus_dagelijkse_oplaadenergie:
    source: sensor.marstek_venus_beta_modbus_totale_oplaadenergie
    cycle: daily
    name: "Marstek Venus Beta Opladen Vandaag"

template:
  # --- EVCC battery power. EVCC: + = ontladen, - = laden ---
  - triggers:
      - trigger: state
        entity_id: sensor.evcc_marstek_alpha_power
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "EVCC Marstek alpha charge power"
        unique_id: evcc_marstek_alpha_charge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.evcc_marstek_alpha_power')) }}"
        state: "{{ [0, -(states('sensor.evcc_marstek_alpha_power') | float(0))] | max }}"

      - name: "EVCC Marstek alpha discharge power"
        unique_id: evcc_marstek_alpha_discharge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.evcc_marstek_alpha_power')) }}"
        state: "{{ [0, states('sensor.evcc_marstek_alpha_power') | float(0)] | max }}"

  - triggers:
      - trigger: state
        entity_id: sensor.evcc_marstek_beta_power
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "EVCC Marstek beta charge power"
        unique_id: evcc_marstek_beta_charge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.evcc_marstek_beta_power')) }}"
        state: "{{ [0, -(states('sensor.evcc_marstek_beta_power') | float(0))] | max }}"

      - name: "EVCC Marstek beta discharge power"
        unique_id: evcc_marstek_beta_discharge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.evcc_marstek_beta_power')) }}"
        state: "{{ [0, states('sensor.evcc_marstek_beta_power') | float(0)] | max }}"

  # sign = -1: zelfde teken als oude Marstek-sensor (laden = +). Zet op 1 als het omgekeerd blijkt.
  - triggers:
      - trigger: state
        entity_id:
          - sensor.evcc_marstek_alpha_power
          - sensor.evcc_marstek_beta_power
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Marstek Combined Grid Power"
        unique_id: marstek_combined_grid_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.evcc_marstek_alpha_power'))
             and is_number(states('sensor.evcc_marstek_beta_power')) }}
        state: >
          {% set sign = -1 %}
          {% set alpha = states('sensor.evcc_marstek_alpha_power') | float(0) %}
          {% set beta  = states('sensor.evcc_marstek_beta_power') | float(0) %}
          {{ ((alpha + beta) * sign) | round(0) }}

  - triggers:
      - trigger: state
        entity_id:
          - sensor.evcc_marstek_alpha_grid_export
          - sensor.evcc_marstek_beta_grid_export
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Marstek Combined Total Grid Export"
        unique_id: marstek_combined_total_grid_export
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ is_number(states('sensor.evcc_marstek_alpha_grid_export'))
             and is_number(states('sensor.evcc_marstek_beta_grid_export')) }}
        state: >
          {% set alpha = states('sensor.evcc_marstek_alpha_grid_export') | float(0) %}
          {% set beta  = states('sensor.evcc_marstek_beta_grid_export') | float(0) %}
          {{ (alpha + beta) | round(3) }}

  - triggers:
      - trigger: state
        entity_id:
          - sensor.evcc_marstek_alpha_grid_import
          - sensor.evcc_marstek_beta_grid_import
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Marstek Combined Total Grid Import"
        unique_id: marstek_combined_total_grid_import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ is_number(states('sensor.evcc_marstek_alpha_grid_import'))
             and is_number(states('sensor.evcc_marstek_beta_grid_import')) }}
        state: >
          {% set alpha = states('sensor.evcc_marstek_alpha_grid_import') | float(0) %}
          {% set beta  = states('sensor.evcc_marstek_beta_grid_import') | float(0) %}
          {{ (alpha + beta) | round(3) }}

  # Guarded battery counters for the Energy dashboard.
  # Discharge (out) = EVCC energy, Modbus 33002. Charge (in) = EVCC
  # returnenergy, Modbus 33000, on the custom meters (not the stock
  # marstek-venus-e template). Prefer the site sum when it is above 0;
  # otherwise the sum of devices/1 and devices/2. The Riemann integral
  # sensor.marstek_combined_total_grid_import is only a charge fallback
  # when returnEnergy is 0 or unavailable.
  # A single decrease or a step above 0.25 kWh is held. If that new
  # source then moves by at most 0.25 kWh per reading for 30 minutes,
  # an offset is stored so the published total continues from the old
  # baseline (no long-term-statistics jump). A stored 0 is still treated
  # as "no baseline" and accepts the first real total.
  - triggers:
      - trigger: state
        entity_id:
          - sensor.evcc_marstek_combined_energy
          - sensor.marstek_combined_total_grid_export
        to: null
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Marstek Combined Total Grid Export Clean"
        unique_id: marstek_combined_total_grid_export_clean
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ is_number(states('sensor.evcc_marstek_combined_energy'))
             or is_number(states('sensor.marstek_combined_total_grid_export'))
             or is_number(this.state) }}
        state: |
          {% set prev_re = this.attributes.get('rebaselined_at', '') %}
          {% set g = namespace(
            candidate=none,
            source='',
            state=none,
            status='source_unavailable',
            offset=this.attributes.get('offset_kwh', 0) | float(0),
            pending_since='',
            pending_candidate='',
            pending_reason='',
            rebaselined_at=prev_re if prev_re not in [none, 'none', 'None'] else '',
            restart=true,
            delta=0,
            src_step=0,
            age=0,
            raw=''
          ) %}

          {% set site = states('sensor.evcc_marstek_combined_energy') %}
          {% set devices = states('sensor.marstek_combined_total_grid_export') %}
          {% if is_number(site) and (site | float) > 0 %}
            {% set g.candidate = (site | float) | round(3) %}
            {% set g.source = 'energy_site' %}
          {% elif is_number(devices) %}
            {% set g.candidate = (devices | float) | round(3) %}
            {% set g.source = 'energy_devices' %}
          {% endif %}

          {% if g.candidate is not none %}
            {% set g.raw = g.candidate %}
          {% endif %}
          {% if g.candidate is none %}
            {% if is_number(this.state) %}
              {% set g.state = this.state | float %}
            {% endif %}
            {% set g.status = 'source_unavailable' %}
          {% elif not is_number(this.state) or (this.state | float) == 0 %}
            {% set g.state = g.candidate %}
            {% set g.status = 'initializing' %}
            {% set g.offset = 0 %}
          {% else %}
            {% set g.delta = (((g.candidate - g.offset) | round(3)) - (this.state | float)) | round(5) %}
            {% if g.delta >= 0 and g.delta <= 0.25 %}
              {% set g.state = (g.candidate - g.offset) | round(3) %}
              {% set g.status = 'ok' %}
            {% else %}
              {% set g.pending_reason = 'rejected_decrease' if g.delta < 0 else 'rejected_jump' %}
              {% set g.restart = true %}
              {% if this.attributes.get('pending_since', '') and is_number(this.attributes.get('pending_candidate', '')) %}
                {% set g.src_step = (g.candidate - (this.attributes.get('pending_candidate') | float)) | round(5) %}
                {% if g.src_step >= -0.001 and g.src_step <= 0.25 %}
                  {% set g.restart = false %}
                {% endif %}
              {% endif %}
              {% if g.restart %}
                {% set g.state = this.state | float %}
                {% set g.status = 'pending_rebaseline' %}
                {% set g.pending_since = now().isoformat() %}
                {% set g.pending_candidate = g.candidate %}
              {% else %}
                {% set g.age = as_timestamp(now()) - as_timestamp(this.attributes.get('pending_since')) %}
                {% if g.age >= 1800 %}
                  {% set g.state = (this.state | float) | round(3) %}
                  {% set g.offset = (g.candidate - (this.state | float)) | round(6) %}
                  {% set g.status = 'rebaselined' %}
                  {% set g.pending_since = '' %}
                  {% set g.pending_candidate = '' %}
                  {% set g.pending_reason = '' %}
                  {% set g.rebaselined_at = now().isoformat() %}
                {% else %}
                  {% set g.state = this.state | float %}
                  {% set g.status = 'pending_rebaseline' %}
                  {% set g.pending_since = this.attributes.get('pending_since') %}
                  {% set g.pending_candidate = g.candidate %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}
          {{ g.state if g.state is not none else none }}
        attributes:
          guard_trace: |
            {% set prev_re = this.attributes.get('rebaselined_at', '') %}
            {% set g = namespace(
              candidate=none,
              source='',
              state=none,
              status='source_unavailable',
              offset=this.attributes.get('offset_kwh', 0) | float(0),
              pending_since='',
              pending_candidate='',
              pending_reason='',
              rebaselined_at=prev_re if prev_re not in [none, 'none', 'None'] else '',
              restart=true,
              delta=0,
              src_step=0,
              age=0,
              raw=''
            ) %}

            {% set site = states('sensor.evcc_marstek_combined_energy') %}
            {% set devices = states('sensor.marstek_combined_total_grid_export') %}
            {% if is_number(site) and (site | float) > 0 %}
              {% set g.candidate = (site | float) | round(3) %}
              {% set g.source = 'energy_site' %}
            {% elif is_number(devices) %}
              {% set g.candidate = (devices | float) | round(3) %}
              {% set g.source = 'energy_devices' %}
            {% endif %}

            {% if g.candidate is not none %}
              {% set g.raw = g.candidate %}
            {% endif %}
            {% if g.candidate is none %}
              {% if is_number(this.state) %}
                {% set g.state = this.state | float %}
              {% endif %}
              {% set g.status = 'source_unavailable' %}
            {% elif not is_number(this.state) or (this.state | float) == 0 %}
              {% set g.state = g.candidate %}
              {% set g.status = 'initializing' %}
              {% set g.offset = 0 %}
            {% else %}
              {% set g.delta = (((g.candidate - g.offset) | round(3)) - (this.state | float)) | round(5) %}
              {% if g.delta >= 0 and g.delta <= 0.25 %}
                {% set g.state = (g.candidate - g.offset) | round(3) %}
                {% set g.status = 'ok' %}
              {% else %}
                {% set g.pending_reason = 'rejected_decrease' if g.delta < 0 else 'rejected_jump' %}
                {% set g.restart = true %}
                {% if this.attributes.get('pending_since', '') and is_number(this.attributes.get('pending_candidate', '')) %}
                  {% set g.src_step = (g.candidate - (this.attributes.get('pending_candidate') | float)) | round(5) %}
                  {% if g.src_step >= -0.001 and g.src_step <= 0.25 %}
                    {% set g.restart = false %}
                  {% endif %}
                {% endif %}
                {% if g.restart %}
                  {% set g.state = this.state | float %}
                  {% set g.status = 'pending_rebaseline' %}
                  {% set g.pending_since = now().isoformat() %}
                  {% set g.pending_candidate = g.candidate %}
                {% else %}
                  {% set g.age = as_timestamp(now()) - as_timestamp(this.attributes.get('pending_since')) %}
                  {% if g.age >= 1800 %}
                    {% set g.state = (this.state | float) | round(3) %}
                    {% set g.offset = (g.candidate - (this.state | float)) | round(6) %}
                    {% set g.status = 'rebaselined' %}
                    {% set g.pending_since = '' %}
                    {% set g.pending_candidate = '' %}
                    {% set g.pending_reason = '' %}
                    {% set g.rebaselined_at = now().isoformat() %}
                  {% else %}
                    {% set g.state = this.state | float %}
                    {% set g.status = 'pending_rebaseline' %}
                    {% set g.pending_since = this.attributes.get('pending_since') %}
                    {% set g.pending_candidate = g.candidate %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endif %}
            {{ g.status }}|{{ g.offset }}|{{ g.pending_since }}|{{ g.pending_candidate }}|{{ g.pending_reason }}|{{ g.rebaselined_at }}|{{ g.raw }}|{{ g.source }}|{{ g.state if g.state is not none else '' }}
          guard_status: "{{ (guard_trace | trim).split('|')[0] }}"
          offset_kwh: "{{ ((guard_trace | trim).split('|')[1]) | float(0) }}"
          pending_since: >
            {% set v = (guard_trace | trim).split('|')[2] %}
            {{ v if v else none }}
          pending_candidate: >
            {% set v = (guard_trace | trim).split('|')[3] %}
            {{ (v | float(none)) if v else none }}
          pending_reason: >
            {% set v = (guard_trace | trim).split('|')[4] %}
            {{ v if v else none }}
          rebaselined_at: >
            {% set v = (guard_trace | trim).split('|')[5] %}
            {{ v if v else none }}
          raw_combined_kwh: >
            {% set v = (guard_trace | trim).split('|')[6] %}
            {{ (v | float(none)) if v else none }}
          source_used: >
            {% set v = (guard_trace | trim).split('|')[7] %}
            {{ v if v else none }}
          direction: discharge
          max_step_kwh: 0.25
  - triggers:
      - trigger: state
        entity_id:
          - sensor.evcc_marstek_combined_returnenergy
          - sensor.evcc_marstek_alpha_returnenergy
          - sensor.evcc_marstek_beta_returnenergy
          - sensor.marstek_combined_total_grid_import
        to: null
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Marstek Combined Total Grid Import Clean"
        unique_id: marstek_combined_total_grid_import_clean
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ is_number(states('sensor.evcc_marstek_combined_returnenergy'))
             or (is_number(states('sensor.evcc_marstek_alpha_returnenergy'))
                 and is_number(states('sensor.evcc_marstek_beta_returnenergy')))
             or is_number(states('sensor.marstek_combined_total_grid_import'))
             or is_number(this.state) }}
        state: |
          {% set prev_re = this.attributes.get('rebaselined_at', '') %}
          {% set g = namespace(
            candidate=none,
            source='',
            state=none,
            status='source_unavailable',
            offset=this.attributes.get('offset_kwh', 0) | float(0),
            pending_since='',
            pending_candidate='',
            pending_reason='',
            rebaselined_at=prev_re if prev_re not in [none, 'none', 'None'] else '',
            restart=true,
            delta=0,
            src_step=0,
            age=0,
            raw=''
          ) %}

          {% set site = states('sensor.evcc_marstek_combined_returnenergy') %}
          {% set alpha = states('sensor.evcc_marstek_alpha_returnenergy') %}
          {% set beta = states('sensor.evcc_marstek_beta_returnenergy') %}
          {% set integral = states('sensor.marstek_combined_total_grid_import') %}
          {% if is_number(site) and (site | float) > 0 %}
            {% set g.candidate = (site | float) | round(3) %}
            {% set g.source = 'returnenergy_site' %}
          {% elif is_number(alpha) and is_number(beta) and ((alpha | float) + (beta | float)) > 0 %}
            {% set g.candidate = ((alpha | float) + (beta | float)) | round(3) %}
            {% set g.source = 'returnenergy_devices' %}
          {% elif is_number(integral) %}
            {% set g.candidate = (integral | float) | round(3) %}
            {% set g.source = 'charge_integral' %}
          {% endif %}

          {% if g.candidate is not none %}
            {% set g.raw = g.candidate %}
          {% endif %}
          {% if g.candidate is none %}
            {% if is_number(this.state) %}
              {% set g.state = this.state | float %}
            {% endif %}
            {% set g.status = 'source_unavailable' %}
          {% elif not is_number(this.state) or (this.state | float) == 0 %}
            {% set g.state = g.candidate %}
            {% set g.status = 'initializing' %}
            {% set g.offset = 0 %}
          {% else %}
            {% set g.delta = (((g.candidate - g.offset) | round(3)) - (this.state | float)) | round(5) %}
            {% if g.delta >= 0 and g.delta <= 0.25 %}
              {% set g.state = (g.candidate - g.offset) | round(3) %}
              {% set g.status = 'ok' %}
            {% else %}
              {% set g.pending_reason = 'rejected_decrease' if g.delta < 0 else 'rejected_jump' %}
              {% set g.restart = true %}
              {% if this.attributes.get('pending_since', '') and is_number(this.attributes.get('pending_candidate', '')) %}
                {% set g.src_step = (g.candidate - (this.attributes.get('pending_candidate') | float)) | round(5) %}
                {% if g.src_step >= -0.001 and g.src_step <= 0.25 %}
                  {% set g.restart = false %}
                {% endif %}
              {% endif %}
              {% if g.restart %}
                {% set g.state = this.state | float %}
                {% set g.status = 'pending_rebaseline' %}
                {% set g.pending_since = now().isoformat() %}
                {% set g.pending_candidate = g.candidate %}
              {% else %}
                {% set g.age = as_timestamp(now()) - as_timestamp(this.attributes.get('pending_since')) %}
                {% if g.age >= 1800 %}
                  {% set g.state = (this.state | float) | round(3) %}
                  {% set g.offset = (g.candidate - (this.state | float)) | round(6) %}
                  {% set g.status = 'rebaselined' %}
                  {% set g.pending_since = '' %}
                  {% set g.pending_candidate = '' %}
                  {% set g.pending_reason = '' %}
                  {% set g.rebaselined_at = now().isoformat() %}
                {% else %}
                  {% set g.state = this.state | float %}
                  {% set g.status = 'pending_rebaseline' %}
                  {% set g.pending_since = this.attributes.get('pending_since') %}
                  {% set g.pending_candidate = g.candidate %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}
          {{ g.state if g.state is not none else none }}
        attributes:
          guard_trace: |
            {% set prev_re = this.attributes.get('rebaselined_at', '') %}
            {% set g = namespace(
              candidate=none,
              source='',
              state=none,
              status='source_unavailable',
              offset=this.attributes.get('offset_kwh', 0) | float(0),
              pending_since='',
              pending_candidate='',
              pending_reason='',
              rebaselined_at=prev_re if prev_re not in [none, 'none', 'None'] else '',
              restart=true,
              delta=0,
              src_step=0,
              age=0,
              raw=''
            ) %}

            {% set site = states('sensor.evcc_marstek_combined_returnenergy') %}
            {% set alpha = states('sensor.evcc_marstek_alpha_returnenergy') %}
            {% set beta = states('sensor.evcc_marstek_beta_returnenergy') %}
            {% set integral = states('sensor.marstek_combined_total_grid_import') %}
            {% if is_number(site) and (site | float) > 0 %}
              {% set g.candidate = (site | float) | round(3) %}
              {% set g.source = 'returnenergy_site' %}
            {% elif is_number(alpha) and is_number(beta) and ((alpha | float) + (beta | float)) > 0 %}
              {% set g.candidate = ((alpha | float) + (beta | float)) | round(3) %}
              {% set g.source = 'returnenergy_devices' %}
            {% elif is_number(integral) %}
              {% set g.candidate = (integral | float) | round(3) %}
              {% set g.source = 'charge_integral' %}
            {% endif %}

            {% if g.candidate is not none %}
              {% set g.raw = g.candidate %}
            {% endif %}
            {% if g.candidate is none %}
              {% if is_number(this.state) %}
                {% set g.state = this.state | float %}
              {% endif %}
              {% set g.status = 'source_unavailable' %}
            {% elif not is_number(this.state) or (this.state | float) == 0 %}
              {% set g.state = g.candidate %}
              {% set g.status = 'initializing' %}
              {% set g.offset = 0 %}
            {% else %}
              {% set g.delta = (((g.candidate - g.offset) | round(3)) - (this.state | float)) | round(5) %}
              {% if g.delta >= 0 and g.delta <= 0.25 %}
                {% set g.state = (g.candidate - g.offset) | round(3) %}
                {% set g.status = 'ok' %}
              {% else %}
                {% set g.pending_reason = 'rejected_decrease' if g.delta < 0 else 'rejected_jump' %}
                {% set g.restart = true %}
                {% if this.attributes.get('pending_since', '') and is_number(this.attributes.get('pending_candidate', '')) %}
                  {% set g.src_step = (g.candidate - (this.attributes.get('pending_candidate') | float)) | round(5) %}
                  {% if g.src_step >= -0.001 and g.src_step <= 0.25 %}
                    {% set g.restart = false %}
                  {% endif %}
                {% endif %}
                {% if g.restart %}
                  {% set g.state = this.state | float %}
                  {% set g.status = 'pending_rebaseline' %}
                  {% set g.pending_since = now().isoformat() %}
                  {% set g.pending_candidate = g.candidate %}
                {% else %}
                  {% set g.age = as_timestamp(now()) - as_timestamp(this.attributes.get('pending_since')) %}
                  {% if g.age >= 1800 %}
                    {% set g.state = (this.state | float) | round(3) %}
                    {% set g.offset = (g.candidate - (this.state | float)) | round(6) %}
                    {% set g.status = 'rebaselined' %}
                    {% set g.pending_since = '' %}
                    {% set g.pending_candidate = '' %}
                    {% set g.pending_reason = '' %}
                    {% set g.rebaselined_at = now().isoformat() %}
                  {% else %}
                    {% set g.state = this.state | float %}
                    {% set g.status = 'pending_rebaseline' %}
                    {% set g.pending_since = this.attributes.get('pending_since') %}
                    {% set g.pending_candidate = g.candidate %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endif %}
            {{ g.status }}|{{ g.offset }}|{{ g.pending_since }}|{{ g.pending_candidate }}|{{ g.pending_reason }}|{{ g.rebaselined_at }}|{{ g.raw }}|{{ g.source }}|{{ g.state if g.state is not none else '' }}
          guard_status: "{{ (guard_trace | trim).split('|')[0] }}"
          offset_kwh: "{{ ((guard_trace | trim).split('|')[1]) | float(0) }}"
          pending_since: >
            {% set v = (guard_trace | trim).split('|')[2] %}
            {{ v if v else none }}
          pending_candidate: >
            {% set v = (guard_trace | trim).split('|')[3] %}
            {{ (v | float(none)) if v else none }}
          pending_reason: >
            {% set v = (guard_trace | trim).split('|')[4] %}
            {{ v if v else none }}
          rebaselined_at: >
            {% set v = (guard_trace | trim).split('|')[5] %}
            {{ v if v else none }}
          raw_combined_kwh: >
            {% set v = (guard_trace | trim).split('|')[6] %}
            {{ (v | float(none)) if v else none }}
          source_used: >
            {% set v = (guard_trace | trim).split('|')[7] %}
            {{ v if v else none }}
          direction: charge
          max_step_kwh: 0.25

  # Slimme meter, English DSMR tarif entities. Hold the last total when the
  # new sum drops or jumps by more than 1 kWh. Trigger-based so `this.state`
  # is the previous total and the sensor does not listen to itself.
  # Availability stays up while a previous total exists, including when a
  # tarif source blips. With no previous total and a non-numeric source the
  # entity is unavailable instead of recording 0.
  - triggers:
      - trigger: state
        entity_id:
          - sensor.electricity_meter_energy_production_tarif_1
          - sensor.electricity_meter_energy_production_tarif_2
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Electricity Total Energy Production Filtered"
        unique_id: electricity_total_energy_production_filtered
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ (is_number(states('sensor.electricity_meter_energy_production_tarif_1'))
              and is_number(states('sensor.electricity_meter_energy_production_tarif_2')))
             or is_number(this.state) }}
        state: >
          {% set t1 = states('sensor.electricity_meter_energy_production_tarif_1') | float(0) %}
          {% set t2 = states('sensor.electricity_meter_energy_production_tarif_2') | float(0) %}
          {% set new = (t1 + t2) | round(3) %}
          {% set old_str = this.state %}
          {% if old_str in ['unknown', 'unavailable', 'none', ''] %}
            {{ new }}
          {% else %}
            {% set old = old_str | float(new) %}
            {% if new < old or (new - old) > 1 %}
              {{ old }}
            {% else %}
              {{ new }}
            {% endif %}
          {% endif %}

  - triggers:
      - trigger: state
        entity_id:
          - sensor.electricity_meter_energy_consumption_tarif_1
          - sensor.electricity_meter_energy_consumption_tarif_2
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Electricity Total Energy Consumption Filtered"
        unique_id: electricity_total_energy_consumption_filtered
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ (is_number(states('sensor.electricity_meter_energy_consumption_tarif_1'))
              and is_number(states('sensor.electricity_meter_energy_consumption_tarif_2')))
             or is_number(this.state) }}
        state: >
          {% set t1 = states('sensor.electricity_meter_energy_consumption_tarif_1') | float(0) %}
          {% set t2 = states('sensor.electricity_meter_energy_consumption_tarif_2') | float(0) %}
          {% set new = (t1 + t2) | round(3) %}
          {% set old_str = this.state %}
          {% if old_str in ['unknown', 'unavailable', 'none', ''] %}
            {{ new }}
          {% else %}
            {% set old = old_str | float(new) %}
            {% if new < old or (new - old) > 1 %}
              {{ old }}
            {% else %}
              {{ new }}
            {% endif %}
          {% endif %}

  # Dutch-named DSMR entities. Not the same objects as the English tarif sensors above.
  - triggers:
      - trigger: state
        entity_id:
          - sensor.electricity_meter_energieverbruik_tarief_1
          - sensor.electricity_meter_energieverbruik_tarief_2
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Grid Import Energy Total"
        unique_id: grid_import_energy_total
        icon: mdi:transmission-tower-import
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: kWh
        availability: >-
          {{ is_number(states('sensor.electricity_meter_energieverbruik_tarief_1'))
             and is_number(states('sensor.electricity_meter_energieverbruik_tarief_2')) }}
        state: >-
          {{ (states('sensor.electricity_meter_energieverbruik_tarief_1') | float(0)
              + states('sensor.electricity_meter_energieverbruik_tarief_2') | float(0)) | round(3) }}

  - triggers:
      - trigger: state
        entity_id:
          - sensor.electricity_meter_energieproductie_tarief_1
          - sensor.electricity_meter_energieproductie_tarief_2
        to: null
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Grid Export Energy Total"
        unique_id: grid_export_energy_total
        icon: mdi:transmission-tower-export
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: kWh
        availability: >-
          {{ is_number(states('sensor.electricity_meter_energieproductie_tarief_1'))
             and is_number(states('sensor.electricity_meter_energieproductie_tarief_2')) }}
        state: >-
          {{ (states('sensor.electricity_meter_energieproductie_tarief_1') | float(0)
              + states('sensor.electricity_meter_energieproductie_tarief_2') | float(0)) | round(3) }}

  - triggers:
      - trigger: state
        entity_id:
          - sensor.electricity_meter_energieverbruik
          - sensor.electricity_meter_energieproductie
        to: null
      - trigger: homeassistant
