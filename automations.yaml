- id: '1778074207873'
  alias: 'Inverter: GoodWe exportlimiet op prijs (met hysterese)'
  description: Zet exportlimiet 0W bij sterk negatieve prijs, 10000W bij positieve
    prijs, maar alleen als wijziging nodig is.
  triggers:
  - trigger: state
    entity_id: sensor.current_electricity_price_all_in
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.current_electricity_price_all_in
        below: -0.005
      - condition: template
        value_template: '{{ states(''number.goodwe_net_exportlimiet'') | float(0)
          != 0 }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.goodwe_net_exportlimiet
        data:
          value: 0
    - conditions:
      - condition: numeric_state
        entity_id: sensor.current_electricity_price_all_in
        above: 0.005
      - condition: template
        value_template: '{{ states(''number.goodwe_net_exportlimiet'') | float(0)
          != 10000 }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.goodwe_net_exportlimiet
        data:
          value: 10000
    default: []
  mode: single
