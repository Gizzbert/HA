- alias: Marstek - laad bij teruglevering
  id: marstek_charge_on_export
  mode: restart
  trigger:
  - platform: state
    entity_id:
    - sensor.net_power_filtered_for_control
    - binary_sensor.pv_surplus
    - sensor.wanted_charge_power
  condition:
  - condition: state
    entity_id: input_boolean.marstek_auto_control_enabled
    state: 'on'
  - condition: state
    entity_id: binary_sensor.pv_surplus
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.wanted_charge_power
    above: 100
  action:
  - variables:
      charge_power: '{% set wanted = states(''sensor.wanted_charge_power'') | float(0)
        %} {% set max_p = states(''input_number.marstek_max_charge_power'') | float(750)
        %} {{ [wanted, max_p] | min | round(0) }}

        '
  - action: marstek_local_api.set_passive_mode
    data:
      device_id: a8ca36bf19731b83739094ba115031a1
      power: '{{ 0 - charge_power }}'
      duration: 300
