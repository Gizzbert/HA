- id: '1679424681830'
  alias: 'Alarm: blink lights & call phone'
  description: ''
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to: triggered
    id: alarm-is-triggered
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to: disarmed
    id: alarm-is-disarmed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm-is-triggered
      sequence:
      - data:
          topic: /openhab/notification/alarm
          payload: PIR tuinkamer alarm
        action: mqtt.publish
      - target:
          entity_id: media_player.yas_209
        data:
          volume_level: 0.5
        action: media_player.volume_set
      - parallel:
        - repeat:
            while:
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: triggered
            - condition: template
              value_template: '{{ repeat.index <= 60 }}'
            sequence:
            - target:
                entity_id: input_boolean.living
              action: input_boolean.turn_on
            - delay:
                seconds: 1
            - target:
                entity_id: input_boolean.living
              action: input_boolean.turn_off
            - delay:
                seconds: 1
        - repeat:
            while:
            - condition: state
              entity_id: alarm_control_panel.home_alarm
              state: triggered
            - condition: template
              value_template: '{{ repeat.index <= 3 }}'
            sequence:
            - target:
                entity_id: media_player.yas_209
              data:
                media:
                  media_content_id: media-source://media_source/local/TF036.WAV
                  media_content_type: audio/x-wav
                  metadata:
                    title: TF036.WAV
                    thumbnail:
                    media_class: music
                    children_media_class:
                    navigateIds:
                    - {}
                    - media_content_type: app
                      media_content_id: media-source://media_source
                    browse_entity_id: media_player.yas_209
              action: media_player.play_media
    - conditions:
      - condition: trigger
        id: alarm-is-disarmed
      sequence:
      - target:
          entity_id: input_boolean.living
        action: input_boolean.turn_off
      - target:
          entity_id: media_player.yas_209
        data:
          volume_level: 0.1
        action: media_player.volume_set
  mode: restart
