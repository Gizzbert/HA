- id: tuinkamer_party_lights_bij_beweging
  alias: 'Lichten: partyverlichting tuinkamer bij beweging'
  description: >
    Zet input_boolean.party_lights aan als binary_sensor.beweging_tuinkamer van
    uit naar aan gaat, de zon onder is (sun.sun below_horizon) en de
    partyverlichting uit staat. Start dan timer.party_lights_tuinkamer eenmalig
    voor 3 minuten. Nieuwe beweging verlengt die tijd niet. Als de timer
    afloopt en input_boolean.party_lights_auto_tuinkamer aan staat, gaan de
    lampen uit.
  mode: queued
  triggers:
  - trigger: state
    entity_id: binary_sensor.beweging_tuinkamer
    from: 'off'
    to: 'on'
    id: beweging_aan
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.party_lights_tuinkamer
    id: timer_af
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: beweging_aan
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: template
        value_template: "{{ is_state('input_boolean.party_lights', 'off') }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.party_lights_auto_tuinkamer
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.party_lights
      - action: timer.start
        target:
          entity_id: timer.party_lights_tuinkamer
    - conditions:
      - condition: trigger
        id: timer_af
      - condition: template
        value_template: "{{ is_state('input_boolean.party_lights_auto_tuinkamer', 'on') }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights_auto_tuinkamer

- id: tuinkamer_party_lights_vlag_wissen
  alias: 'Lichten: tuinkamer partyverlichting vlag wissen'
  description: >
    Zet de eigendomsvlag uit en annuleer timer.party_lights_tuinkamer als de
    partyverlichting van aan naar uit gaat en uit blijft, of bij een herstart.
    Bij een herstart gaan de lampen ook uit als deze automatisering ze nog
    bezit, omdat de timer niet wordt hersteld. De korte bevestiging negeert
    een master-switch echo van stopcontact 8 of sf501d.
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_boolean.party_lights
    from: 'on'
    to: 'off'
    id: lichten_uit
  - trigger: homeassistant
    event: start
    id: herstart
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: herstart
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.party_lights_tuinkamer
      - condition: template
        value_template: "{{ is_state('input_boolean.party_lights_auto_tuinkamer', 'on') }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights_auto_tuinkamer
    - conditions:
      - condition: trigger
        id: lichten_uit
      sequence:
      - delay:
          seconds: 3
      - condition: template
        value_template: "{{ is_state('input_boolean.party_lights', 'off') }}"
      - action: timer.cancel
        target:
          entity_id: timer.party_lights_tuinkamer
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights_auto_tuinkamer
