    above: -50
    for:
      minutes: 2
  condition:
  - condition: state
    entity_id: input_boolean.marstek_auto_control_enabled
    state: 'on'
  action:
  - action: marstek_local_api.set_passive_mode
    data:
      device_id: a8ca36bf19731b83739094ba115031a1
      power: 0
      duration: 300
