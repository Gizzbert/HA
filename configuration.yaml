#--------------------------- INPUT SELECT ----------------------#
input_select:

### FAN levels ###
  fan_level:
    name: Fan level
    options:
      - Laag
      - Normaal
      - Hoog
      - Douche
    initial: Normaal
    icon: mdi:fan

### LOG levels ###
  log_level:
    name: Log level
    options:
      - debug
      - info
      - warning
      - error
      - critical
    initial: warning
    icon: mdi:bug

#---------------------- INPUT BOOLEAN --------------------------#
input_boolean:
  marstek_auto_control_enabled:
    name: Marstek Auto Control Enabled

  # Created from this file at Home Assistant startup, not on an automation
  # reload. There is no second input_boolean: key and no package defines one,
  # so this does not collide with the UI helper input_boolean.party_lights.
  party_lights_auto_tuinkamer:
    name: Party lights aan door tuinkamer
    icon: mdi:motion-sensor
    initial: off

# Fixed 3 minutes from the moment the tuinkamer automation turns the lights
# on. Later motion does not restart it. restore is false: after a restart
# the timer is idle, and the vlag-wissen automation turns the lights off if
# this automation still owns them.
timer:
  party_lights_tuinkamer:
    name: Partyverlichting tuinkamer
    duration: "00:03:00"
    restore: false
    icon: mdi:timer-outline

input_number:
  marstek_min_soc_night:
    name: Marstek Minimum SoC Night
    min: 15
    max: 80
    step: 1
    unit_of_measurement: "%"
    initial: 20

  marstek_max_charge_power:
    name: Marstek Max Charge Power
    min: 100
    max: 800
    step: 50
    unit_of_measurement: "W"
    initial: 800

#---------------- ALEXA ----------------------------------------#

alexa:
  smart_home:
    filter:
      include_entities:
        - input_boolean.living
        - input_boolean.dresser
        - input_boolean.veranda
        - input_boolean.party_lights
        - input_boolean.xmaslights
        - input_boolean.nightmode
        - media_player.yas_209
        - group.living_lights_group
        - group.veranda_lights_group
    entity_config:
      input_boolean.veranda:
        name: Veranda
      input_boolean.party_lights:
        name: Party lights
      input_boolean.living:
        name: Living
      input_boolean.dresser:
        name: Dresser
      input_boolean.xmaslights:
        name: Christmas lights
      input_boolean.nightmode:
        name: Night mode
      group.living_lights_group:
        name: Living lights
      group.veranda_lights_group:
        name: Veranda lights


