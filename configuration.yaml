# Loads default set of integrations. Do not remove.
default_config:

### Includes ###
# `automation:` is the file the UI edits (automations.yaml).
# `automation split:` is the same integration; the label only lets both load.
# automation: !include automations.yaml
automation split: !include_dir_merge_list automations/
mqtt: !include mqtt.yaml
group: !include groups.yaml
template: !include templates.yaml


### Text to speech ###
tts:
  - platform: google_translate


### HA core configs ###
homeassistant:
  name: Home
  latitude: 52.09339
  longitude: 5.00380
  unit_system: metric
  external_url: "https://ha.gizz.nl:443"
  internal_url: "http://192.168.0.130:8123"
  packages: !include_dir_named packages

logger:
  default: warning
  logs:
    homeassistant.core: error
    homeassistant.components.mqtt: info


# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes


### Telegram ### config moved to UI


