recorder:
  purge_keep_days: 10          # of 14
  commit_interval: 30
  exclude:
    domains:
      - device_tracker
      - media_player
      - uptime
      - time_date
      - worldclock
    entity_globs:
      - sensor.*uptime*
      - sensor.*rssi*
      - sensor.*vcc*
      - sensor.*interval*
      - sensor.licht_huiskamer
      - binary_sensor.*keepalive*
      - sensor.clock*
      - sensor.date*
      - sensor.glances*
      - sensor.load_*m
      - sensor.time*
      - sensor.uptime*
      - sensor.CPH2399*
      - binary_sensor.CPH2399*
    entities:
      - camera.front_door
      - sensor.home_assistant_v2_db
      - sensor.memory_free
      - sensor.memory_use
      - sensor.memory_use_percent
      - sensor.processor_use
      - weather.openweathermap
      - sun.sun
      # Attributes exceed the recorder's 16 KB limit and are already dropped.
      # Apexcharts reads these attributes live; nothing uses their history.
      - sensor.nextenergy_prices_today
      - sensor.nextenergy_electricity_export_tariff

###### ALARM Control Panel
alarm_control_panel:
  - platform: manual
    name: Home Alarm
#    code: 1234
    code_arm_required: false
    arming_time: 10 # armin state duration
    delay_time: 10 # time of the pending state before triggering alarm
    trigger_time: 120 # the time of the triggered state in which the alarm is firing
    disarm_after_trigger: false
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 0
      delay_time: 0
