  - platform: filter
    name: "smoothed light living"
    entity_id: sensor.licht_huiskamer
    filters:
      - filter: lowpass
        time_constant: 10
        precision: 2

### Cumulatieve energie (kWh) → vermogen (kW) via derivative, voor Net Power (W) ###
# Filtered totals and EVCC charge/discharge templates live in
# packages/energy_calculations.yaml. These derivative sensors have no unique_id,
# so they stay here (moving them would orphan long-term statistics). The
# integration sensors feed sensor.marstek_combined_total_grid_import.
  - platform: derivative
    source: sensor.electricity_total_energy_consumption_filtered
    name: Electricity Power Consumption Derived
    unit_time: h
    unit: kW
    round: 3
    time_window: "00:10:00"

  - platform: derivative
    source: sensor.electricity_total_energy_production_filtered
    name: Electricity Power Production Derived
    unit_time: h
    unit: kW
    round: 3
    time_window: "00:10:00"


  - platform: integration
    source: sensor.evcc_marstek_alpha_charge_power
    name: "EVCC Marstek alpha grid import"
    unique_id: evcc_marstek_alpha_grid_import
    unit_prefix: k
    method: left
    round: 3

  - platform: integration
    source: sensor.evcc_marstek_beta_charge_power
    name: "EVCC Marstek beta grid import"
    unique_id: evcc_marstek_beta_grid_import
    unit_prefix: k
    method: left
    round: 3


