#mqtt:
  sensor:

### backup HA ###
    - name: "HA backup copy"
      # This sensor listens for messages on the MQTT topic "/pi/backup". It's designed to receive updates about completion of Home Assistant backup copy to Raspi4
      state_topic: "/pi/backup"
      expire_after: 172800
      unique_id: 'mqtt.HA.backup.copy'

### Node 1: RFM Gateway ###
    - name: "1: Uptime"
      unique_id: 'mqtt.node01'
      state_topic: "home/rfm_gw/nb/node01/dev00"
      unit_of_measurement: 'days'
      value_template: "{{ ((value | int) /60 / 24|float) | round(1) }}"
      expire_after: 3600


