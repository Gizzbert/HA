### EVCC: Marstek batterijen (EVCC: + = ontladen, - = laden) ###

    - name: "EVCC Marstek alpha power"
      unique_id: evcc_marstek_alpha_power
      state_topic: "evcc/site/battery/devices/1/power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 300
    - name: "EVCC Marstek beta power"
      unique_id: evcc_marstek_beta_power
      state_topic: "evcc/site/battery/devices/2/power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 300
    - name: "EVCC Marstek alpha SoC"
      unique_id: evcc_marstek_alpha_soc
      state_topic: "evcc/site/battery/devices/1/soc"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      expire_after: 300
    - name: "EVCC Marstek beta SoC"
      unique_id: evcc_marstek_beta_soc
      state_topic: "evcc/site/battery/devices/2/soc"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      expire_after: 300
    - name: "EVCC Marstek totaal SoC"
      unique_id: evcc_marstek_total_soc
      state_topic: "evcc/site/battery/soc"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      expire_after: 300
    - name: "EVCC huisverbruik"
      unique_id: evcc_home_power
      state_topic: "evcc/site/homePower"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 300

    # EVCC battery energy, kWh. These meters are type: custom, not the
    # stock marstek-venus-e template. energy = holding 33002 uint32
    # scale 0.01 (total discharged, out of the battery). returnenergy =
    # holding 33000 uint32 scale 0.01 (total charged, into the battery).
    # EVCC publishes the site sums on evcc/site/battery/energy and
    # evcc/site/battery/returnEnergy, and each battery on
    # evcc/site/battery/devices/{1,2}/... (devices are 1-based).
    - name: "EVCC Marstek alpha grid export"
      unique_id: evcc_marstek_alpha_grid_export
      state_topic: "evcc/site/battery/devices/1/energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 300

    - name: "EVCC Marstek beta grid export"
      unique_id: evcc_marstek_beta_grid_export
      state_topic: "evcc/site/battery/devices/2/energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 300

    - name: "EVCC Marstek alpha returnEnergy"
      unique_id: evcc_marstek_alpha_returnenergy
      state_topic: "evcc/site/battery/devices/1/returnEnergy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 300

    - name: "EVCC Marstek beta returnEnergy"
      unique_id: evcc_marstek_beta_returnenergy
      state_topic: "evcc/site/battery/devices/2/returnEnergy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 300

    - name: "EVCC Marstek combined energy"
      unique_id: evcc_marstek_combined_energy
      state_topic: "evcc/site/battery/energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 300

    - name: "EVCC Marstek combined returnEnergy"
      unique_id: evcc_marstek_combined_returnenergy
      state_topic: "evcc/site/battery/returnEnergy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 300

### Node 4: tuinkamer beweging ###

  binary_sensor:
    - name: "Beweging tuinkamer"
      unique_id: 'mqtt.node04.movement'
      state_topic: "home/rfm_gw/nb/node04/dev41"
      off_delay: 5

### EVCC: laden van net ###
    - name: "EVCC batterij laden van net"
      unique_id: evcc_battery_grid_charge_active
      state_topic: "evcc/site/batteryGridChargeActive"
      payload_on: "true"
      payload_off: "false"


