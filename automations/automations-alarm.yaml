- id: '1679866899444'
  alias: 'Alarm: alert on movement detected in hallway'
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.pir1_occupancy
    to: 'on'
  condition:
  - condition: time
    after: 00:00:00
    before: 06:00:00
  action:
  - service: notify.mobile_app_oneplus
    data:
      message: yo, busy in hallway {{ states('sensor.time') }}
  mode: single
