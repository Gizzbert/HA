- id: '1679350655258'
  alias: 'Fan: hum - day max'
  description: ''
  trigger:
  - platform: mqtt
    topic: home/rfm_gw/nb/node03/dev49
  condition:
  - condition: numeric_state
    entity_id: sensor.vocht_badkamer
    above: 90
  - condition: time
    after: 08:00:00
    before: '20:00:00'
  action:
  - service: input_select.select_option
    data:
      option: Douche
    target:
      entity_id: input_select.fan_level
  - delay:
      minutes: 25
  - service: input_select.select_option
    data:
      option: Normaal
    target:
      entity_id: input_select.fan_level
  mode: single

- id: '1679350885909'
  alias: 'Fan: hum - day high'
  description: ''
  trigger:
  - platform: mqtt
    topic: home/rfm_gw/nb/node03/dev49
  condition:
  - condition: numeric_state
    entity_id: sensor.vocht_badkamer
    above: 75
    below: 90
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  action:
  - service: input_select.select_option
    data:
      option: Hoog
    target:
      entity_id: input_select.fan_level
  - delay:
      minutes: 25
  - service: input_select.select_option
    data:
      option: Normaal
    target:
      entity_id: input_select.fan_level
  - if:
    - condition: time
      after: '23:00:00'
      before: 07:00:00
    then:
    - service: input_select.select_option
      metadata: {}
      data:
        option: Laag
      target:
        entity_id: input_select.fan_level
  mode: single

