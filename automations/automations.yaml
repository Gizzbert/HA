- id: '1740062561882'
  alias: 433 Schakelaar signal repeat
  description: Handles repeated on/off actions for multiple switches.
  triggers:
  - entity_id:
    - switch.schakelaar_1_oud
    - switch.schakelaar_2_oud
    - switch.schakelaar_a
    - switch.schakelaar_c
    trigger: state
  conditions: []
  actions:
  - variables:
      target_switch: "{% if trigger.entity_id == 'switch.schakelaar_1_oud' %}\n  switch.schakelaar_1_oud\n{%
        elif trigger.entity_id == 'switch.schakelaar_2_oud' %}\n  switch.schakelaar_2_oud\n{%
        elif trigger.entity_id == 'switch.schakelaar_a' %}\n  switch.schakelaar_a\n{%
        elif trigger.entity_id == 'switch.schakelaar_c' %}\n  switch.schakelaar_c\n{%
        endif %}\n"
      repeat_count: "{% if trigger.entity_id in ['switch.schakelaar_1_oud', 'switch.schakelaar_2_oud']
        %}\n  5\n{% else %}\n  3\n{% endif %}\n"
      delay_seconds: "{% if trigger.entity_id in ['switch.schakelaar_1_oud', 'switch.schakelaar_2_oud']
        %}\n  2\n{% else %}\n  1\n{% endif %}\n"
      action_to_perform: "{% if trigger.to_state.state == 'on' %}\n  switch.turn_on\n{%
        else %}\n  switch.turn_off\n{% endif %}\n"
  - repeat:
      count: '{{ repeat_count }}'
      sequence:
      - target:
          entity_id: '{{ target_switch }}'
        action: '{{ action_to_perform }}'
      - delay:
          seconds: '{{ delay_seconds }}'
  mode: single

