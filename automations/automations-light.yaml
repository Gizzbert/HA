- id: '1735901313144'
  alias: 'Lights: living lights'
  description: Controls living room and dresser lights based on time of day and week
  triggers:
  - trigger: time
    at: 06:40:00
  - trigger: time
    at: 08:00:00
  - trigger: sun
    event: sunset
    offset: -00:15:00
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      - condition: sun
        before: sunrise
        before_offset: +00:20:00
      - condition: time
        after: 06:39:00
        before: 06:41:00
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dresser
        data: {}
      - wait_for_trigger:
        - trigger: sun
          event: sunrise
          offset: +00:20:00
      - condition: state
        entity_id: input_boolean.xmas_override
        state: 'off'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dresser
        data: {}
    - conditions:
      - condition: time
        weekday:
        - sat
        - sun
      - condition: sun
        before: sunrise
        before_offset: +00:20:00
      - condition: time
        after: 07:59:00
        before: 08:01:00
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.living
        data: {}
      - wait_for_trigger:
        - trigger: sun
          event: sunrise
          offset: +00:20:00
      - condition: state
        entity_id: input_boolean.xmas_override
        state: 'off'
        enabled: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.living
        data: {}
    - conditions:
      - condition: sun
        after: sunset
        after_offset: -00:16:00
        before: sunset
        before_offset: -00:14:00
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.living
        data: {}
      - wait_for_trigger:
        - trigger: time
          at: 00:30:00
      - condition: state
        entity_id: input_boolean.xmas_override
        state: 'off'
        enabled: false
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.living
          - input_boolean.dresser
        data: {}
  mode: single

