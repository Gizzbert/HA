- id: tuinkamer_party_lights_bij_beweging
  alias: 'Lichten: partyverlichting tuinkamer bij beweging'
  description: >
    Zet input_boolean.party_lights aan bij beweging in de tuinkamer als de zon
    onder is en de partyverlichting uit staat. Zet ze alleen weer uit als deze
    automatisering ze zelf heeft aangezet (input_boolean.party_lights_auto_tuinkamer).
    Donker is sun.sun below_horizon, dezelfde nachtperiode als de sunset-automations.
    De vlag gaat uit bij handmatig uit, of bij een herstart van Home Assistant.
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.beweging_tuinkamer
    to: 'on'
    id: beweging_aan
  - trigger: state
    entity_id: binary_sensor.beweging_tuinkamer
    to: 'off'
    id: beweging_uit
  - trigger: state
    entity_id: input_boolean.party_lights
    to: 'off'
    id: lichten_uit
  - trigger: homeassistant
    event: start
    id: herstart
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: beweging_aan
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: input_boolean.party_lights
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.party_lights_auto_tuinkamer
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.party_lights
    - conditions:
      - condition: trigger
        id: beweging_uit
      sequence:
      - delay:
          seconds: 20
      - condition: state
        entity_id: binary_sensor.beweging_tuinkamer
        state: 'off'
      - condition: state
        entity_id: input_boolean.party_lights_auto_tuinkamer
        state: 'on'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights_auto_tuinkamer
    - conditions:
      - condition: trigger
        id:
        - lichten_uit
        - herstart
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights_auto_tuinkamer

