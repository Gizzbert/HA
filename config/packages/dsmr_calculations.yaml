# =============================================================================
# Marstek Energy Dashboard - slimme meter + zon calculations (package)
# Aangepast voor de officiele "DSMR Smart Meter" core-integratie
# (entity-prefix "electricity_meter") i.p.v. de dsmr_reader add-on uit het
# origineel van https://haprofs.com/marstek-energy-dashboard-...
#
# Plaats dit bestand in de map "packages" van je Home Assistant config
# (config/packages/dsmr_calculations.yaml) en herstart Home Assistant.
#
# TE CONTROLEREN / TODO (kon ik niet automatisch afleiden):
# 1) "huidig vermogen teruggeleverd" (instantaan, in Watt) is nooit expliciet
#    aangeleverd. De DSMR-integratie maakt naast sensor.electricity_meter_power_consumption
#    meestal ook sensor.electricity_meter_power_production aan. Check dit via
#    Instellingen > Apparaten & Diensten > Entiteiten (filter "electricity_meter")
#    en pas hieronder aan als de naam anders is.
# 2) sensor.goodwe_today_s_pv_generation en sensor.sunnyboy_today_s_energy_supply
#    zijn DAGTOTALEN in kWh, geen instantaan vermogen (W). Voor "Totale Zon
#    Vermogen" hieronder heb ik placeholders neergezet
#    (sensor.goodwe_active_power / sensor.sunnyboy_pv_power) - zoek de echte
#    instantane vermogen-sensoren (device_class: power, eenheid W) van je
#    GoodWe en Sunny Boy omvormers op en vul ze in.
# 3) Gas- en watermeter zijn niet meegenomen (niet aangeleverd) - zie de
#    "Smart Meter Totals"-kaart in het dashboardbestand om die zelf toe te
#    voegen als je ze wilt.
# =============================================================================

template:
  - sensor:
      - name: "Netto Energieverbruik"
        unique_id: net_energy_consumption
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.electricity_meter_power_consumption') | float(0))
             - (states('sensor.electricity_meter_power_production') | float(0)) }}

      # Splitst net_energy_consumption in een positieve en een negatieve reeks
      # voor het apexcharts-diagram (met transparante vulling)
      - name: "Netto Energie Verbruik"
        unique_id: net_energy_positive
        unit_of_measurement: "W"
        state: >
          {% set val = states('sensor.net_energy_consumption') | float(0) %}
          {{ val if val > 0 else 0 }}

      - name: "Netto Energie Teruglevering (negatief)"
        unique_id: net_energy_negative
        unit_of_measurement: "W"
        state: >
          {% set val = states('sensor.net_energy_consumption') | float(0) %}
          {{ val if val < 0 else 0 }}

      # Zet net_energy_consumption altijd om naar een positieve waarde
      # (nodig voor de eigen-verbruik berekening hieronder)
      - name: "Positieve Sensor"
        unique_id: positieve_sensor
        unit_of_measurement: "W"
        state: >
          {% set netto = states('sensor.net_energy_consumption') | float(0) %}
          {{ netto * -1 if netto < 0 else netto }}

      # TODO: vervang door de echte real-time vermogen (W) sensoren van je
      # omvormers, zie opmerking 2 hierboven
      - name: "Totale Zon Vermogen"
        unique_id: total_solar_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [
            'sensor.goodwe_pv_power',
            'sensor.clamp_power_meter_vermogen',
          ] %}
          {{ pv | map('states') | map('float', 0) | sum }}

      # als netto verbruik < 0 dan opbrengst - positieve_sensor
      # als netto verbruik > 0 dan opbrengst + positieve_sensor
      - name: "Eigen Verbruik"
        unique_id: eigen_verbruik
        unit_of_measurement: "W"
        state: >
          {% set netto = states('sensor.net_energy_consumption') | float(0) %}
          {% set opbrengst = states('sensor.total_solar_power') | float(0) %}
          {% set positief = states('sensor.positieve_sensor') | float(0) %}
          {% if netto > 0 %}
            {{ (opbrengst + positief) | round(0) }}
          {% elif netto < 0 %}
            {{ (opbrengst - positief) | round(0) }}
          {% else %}
            {{ opbrengst | round(0) }}
          {% endif %}
