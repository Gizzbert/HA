# =============================================================================
# Marstek Energy Dashboard - calculations (package)
# Aangepast voor jouw installatie: 1x Marstek Venus (beta) via de ViperRNMC
# "Marstek Venus Modbus" custom integration, entity-prefix: marstek_venus_beta_modbus
# Modbus TCP (i.p.v. WiFi) voor stabielere, fijnmazige aansturing.
#
# Bron/inspiratie dashboard: https://haprofs.com/marstek-energy-dashboard-home-assistant-batterijen-slimme-meter-zonnepanelen/
#
# UITBREIDEN NAAR BATTERIJ 2 (zodra je die aansluit):
#   Voeg de entity_id van de 2e batterij toe aan elke "batteries = [...]" lijst
#   hieronder (gewoon een extra regel met de juiste sensor.<naam>_... entity_id).
#   Er hoeft verder niets anders aangepast te worden - de sommen/gemiddeldes
#   passen zich automatisch aan het aantal batterijen in de lijst aan.
#
# Plaats dit bestand in de map "packages" van je Home Assistant config
# (config/packages/marstek_calculations.yaml) en herstart Home Assistant.
# =============================================================================

# -----------------------------------------------------------------------------
# Dagelijkse laad-/ontlaadenergie via Utility Meter helpers.
#
# LET OP: bij jouw integratie/taalinstelling zijn "totale_ontlaadenergie" en
# "totale_oplaadenergie" LEVENSDUUR-totalen (cumulatief, resetten nooit), geen
# "vandaag"-sensoren. Deze Utility Meter helpers maken daar wel dagtotalen van
# door dagelijks (om middernacht) het verschil bij te houden.
# Als de integratie later alsnog eigen "vandaag"-sensoren toevoegt/inschakelt
# (total_daily_discharging_energy / total_daily_charging_energy), kun je deze
# utility_meter helpers laten staan of vervangen door die native sensoren.
# -----------------------------------------------------------------------------
utility_meter:
  marstek_venus_beta_modbus_dagelijkse_ontlaadenergie:
    source: sensor.marstek_venus_beta_modbus_totale_ontlaadenergie
    cycle: daily
    name: "Marstek Venus Beta Ontladen Vandaag"
  marstek_venus_beta_modbus_dagelijkse_oplaadenergie:
    source: sensor.marstek_venus_beta_modbus_totale_oplaadenergie
    cycle: daily
    name: "Marstek Venus Beta Opladen Vandaag"

template:
  - sensor:
      # ---- Totalen over alle batterijen (nu 1, straks 2) ----
      - name: "Marstek Total AC Power"
        unique_id: marstek_total_ac_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set batteries = [
            'sensor.marstek_venus_beta_modbus_ac_vermogen',
            # 'sensor.<naam_batterij_2>_ac_vermogen',
          ] %}
          {{ batteries | map('states') | map('float', 0) | sum }}

      - name: "Marstek Average Battery SoC"
        unique_id: marstek_average_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >
          {% set batteries = [
            'sensor.marstek_venus_beta_modbus_batterij_soc',
            # 'sensor.<naam_batterij_2>_batterij_soc',
          ] %}
          {{ (batteries | map('states') | map('float', 0) | list | sum / batteries | length) | round(1) }}

      - name: "Marstek Total Stored Energy"
        unique_id: marstek_total_stored_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set batteries = [
            'sensor.marstek_venus_beta_modbus_opgeslagen_energie',
            # 'sensor.<naam_batterij_2>_opgeslagen_energie',
          ] %}
          {{ (batteries | map('states') | map('float', 0) | sum) | round(2) }}

      - name: "Marstek Total Discharging Energy Today"
        unique_id: marstek_total_discharging_energy_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set batteries = [
            'sensor.marstek_venus_beta_modbus_dagelijkse_ontlaadenergie',
            # 'sensor.<naam_batterij_2>_dagelijkse_ontlaadenergie',
          ] %}
          {{ (batteries | map('states') | map('float', 0) | sum) | round(2) }}

      # ---- Eigen verbruik: hergebruikt sensor.net_energy_consumption en
      #      sensor.total_solar_power uit dsmr_calculations.yaml ----
      - name: "Own Usage Power"
        unique_id: own_usage_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = states('sensor.total_solar_power') | float(0) %}
          {% set grid = states('sensor.net_energy_consumption') | float(0) %}
          {% set batt = states('sensor.marstek_total_ac_power') | float(0) %}

          {% set net_import = max(0, grid) %}
          {% set batt_discharge = max(0, batt) %}
          {% set batt_charge = max(0, -batt) %}

          {{ max(0, net_import + pv + batt_discharge - batt_charge) }}
